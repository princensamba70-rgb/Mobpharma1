server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Sécurité
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # API → conteneur backend
    # resolver Docker + variable : Nginx démarre même si l'API n'est pas encore
    # résolue, et récupère automatiquement après un redémarrage de l'API
    # (évite les 502 définitifs dus au cache DNS de Nginx au boot).
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend http://api:4000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        client_max_body_size 10m;

        # Page d'erreur explicite si le backend est réellement injoignable
        error_page 502 503 504 = @api_down;
    }

    location @api_down {
        default_type application/json;
        return 503 '{"error":"Service backend momentanément injoignable. L’API AMI PHARMA démarre ou est arrêtée — réessayez dans quelques secondes."}';
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache des assets buildés
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
